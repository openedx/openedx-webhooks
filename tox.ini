[tox]
envlist = quality, docs, py
requires = tox-uv>=1

[testenv]
runner = uv-venv-lock-runner
setenv =
    PYTHONPATH = {toxinidir}
dependency_groups =
    test
allowlist_externals = make
commands =
    make test

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
allowlist_externals = make
commands =
    make pylint
    make mypy

[testenv:docs]
runner = uv-venv-lock-runner
dependency_groups = doc
changedir = docs
allowlist_externals = make
commands =
    make html
